name: Legal drift gate
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # The generated EULA.rtf + eula_master.html must match LICENSE.md exactly.
      - run: python generate_eula.py --check
